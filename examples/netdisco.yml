# Read-only inventory; public settings only. This endpoint is intentionally invalid.
platform: h3c_wireless
netdisco:
  source: http
  url: https://netdisco.example.invalid
  cache_enabled: true
  cache_mode: prefer
  # Required with API-key caching when ND_USERNAME is absent; not a credential.
  cache_namespace: example-inventory-reader
inventory:
  include_vendors: [h3c_wireless]
