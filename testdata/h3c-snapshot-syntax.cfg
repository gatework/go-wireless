sysname SYNTHETIC
wlan load-balance mode session 40
wlan load-balance enable
wlan ap-backup hot-backup enable global
#
wlan ap AP-SYNTHETIC model MODEL-SYNTHETIC
 mac-address 0200-0000-0011
 ethernet 1
  vlan 20
#
wlan ap-group GROUP-SYNTHETIC
 ap-model MODEL-SYNTHETIC
  radio 1
   option client reject enable
   option roam-navigation enable rssi 17 probe-response-power 14
  radio 2
   option client reject enable rssi 20
#
wlan service-template WEB-SYNTHETIC
 ssid SYNTHETIC
 vlan 20
 portal apply web-server named-server
return
