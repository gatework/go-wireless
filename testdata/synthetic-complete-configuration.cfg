sysname SYNTHETIC-AC
dot1x
undo mac-authentication
dot1x authentication-method chap
mac-authentication user-name-format mac-address without-hyphen lowercase
dot1x domain EAP-DOMAIN
mac-authentication domain MAB-DOMAIN
wlan tcp mss 1400
wlan auto-ap enable
wlan auto-persistent enable
wlan band-navigation enable
wlan client inspect enable
wlan radio-load-balance band-navigation enable
wlan image-load filepath flash:/ap-image
wlan fast-forwarding mode hardware
wlan tunnel-preempt enable
wlan static-blacklist mac-address 0200-0000-0001 blocked-for-test
wlan client-security static-whitelist mac-address 0200-0000-0002
#
wlan global-configuration
 region-code-lock enable
 nas-id controller-id
 radio 5g
  radio enable
  channel auto unlock
  channel band-width 80+80MHz
  max-power 20.5
  rate mandatory 6 12 24
  rate supported 9 18 36 48 54
  rate disabled 1 2
  rate multicast auto
  option client reject enable rssi -75
  option client reconnect enable rssi -65
  sacp anti-sticky enable rssi -78 interval 20
  packet-filter name inbound-filter inbound
  packet-filter name outbound-filter outbound
  radar-detect disable
  calibrate-channel self-decisive enable all
  calibrate-power self-decisive enable all
#
wlan ap-license-group
 local ip 192.0.2.1
 member ip 192.0.2.2
 member ip 2001:db8::2
 ap-license-synchronization enable
#
wlan vip-client-group
 client-mac 0200-0000-0003
#
wlan virtual-ap-group VIRTUAL
 auto-ap enable
 radio 6g
  radio disable
  sacp anti-sticky enable interval 30
#
wlan ap-group LAB type normal
 ap AP-1
 serial-id AP-SERIAL
 vlan 120
 rrop anti-bmc network ipv4-and-ipv6-simple enable
 rrop anti-bmc default-action deny
 ap-model MODEL-A
  radio 1
   service-template EAP vlan 120
   service-template GUEST
   channel 36
  gigabitethernet 1
   description model-port
 radio 2.4g
  radio enable
#
wlan service-template EAP
 ssid Corporate Network
 vlan 120
 service-template enable
 preshared-key pass-phrase simple SYNTHETIC-NONSECRET
 akm mode 802.1x psk
 cipher-suite ccmp
 cipher-suite tkip
 security-ie rsn
 security-ie wpa
 client-security authentication-mode mac-and-dot1x
 client-security ignore-authentication
 client-security ignore-authorization
 dot1x domain EAP-DOMAIN
 mac-authentication domain MAB-DOMAIN
 portal enable method direct
 portal domain PORTAL-DOMAIN
 portal bas-ip 192.0.2.8
 portal apply web-server https://example.test/synthetic
 portal apply mac-trigger-server trigger
 dot1x
 mac-authentication
 dot1x authentication-method eap
 mac-authentication user-name-format fixed account synthetic password cipher SYNTHETIC-NONSECRET
 dot1x timer supp-timeout 30
 dot1x timer tx-period 10
 dot1x retry 5
 beacon ssid-hide
 bss transition-management enable
 bss transition-management disassociation forced timer 100
 client keep-alive enable
 client keep-alive interval 30
 client max-count 50
 client cache aging-time 100
 client-rate-limit enable
 client-rate-limit inbound mode dynamic cir 1000
 client-rate-limit outbound mode dynamic cir 2000
 broadcast-probe reply disable
 client forwarding-location ap
#
wlan service-template GUEST
 ssid Guest
 undo service-template enable
 akm mode psk
#
wlan ap AP-1 model MODEL-A
 serial-id AP-SERIAL
 firmware-upgrade enable
 statistics-interval 60
 priority 3
 description AP test
 map-configuration test.cfg
 backup-ac ip 2001:db8::1
 led-mode normal
 gigabitethernet 1
  description uplink
 radio 1
  service-template EAP vlan 120
  radio enable
return
